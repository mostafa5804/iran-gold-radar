name: Refresh market and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_analysis:
        description: 'Refresh Gemini research even if younger than 6 hours (may incur API charges)'
        type: boolean
        default: false
      model:
        description: 'Exact Gemini model ID (empty keeps selected server model; first choice is gemini-3.8-flash when available)'
        type: string
        default: ''
      sources_json:
        description: 'Optional public sources JSON array (content goes to Google; reports and workflow metadata may be public)'
        type: string
        default: ''
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: gold-radar-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Check calculation invariants
        run: node --test tests/*.test.js
      - name: Check collector parsers
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Collect actual market data
        run: python3 scripts/collect.py
      - name: Grounded news analysis (optional secret)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MANUAL_SOURCES: ${{ inputs.sources_json }}
          REQUESTED_MODEL: ${{ inputs.model }}
          FORCE_ANALYSIS: ${{ inputs.force_analysis && 'true' || 'false' }}
        run: python3 scripts/analyze.py
      - name: Keep market history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh market and research [skip ci]'
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
